events { }

http {
    include       mime.types;
    default_type  application/octet-stream;

    # nginx's bundled mime.types doesn't include wasm — Blazor needs the
    # correct content-type for WebAssembly.instantiateStreaming to work.
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Blazor client-side routing — fall back to index.html for any
        # path that isn't a real static file.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
